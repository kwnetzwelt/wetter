<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dynamic Sun Icon for Favicon -->
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ffc107; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800; stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Rays -->
  <g transform="translate(50,50)" fill="#ffc107">
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(0)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(45)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(90)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(135)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(180)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(225)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(270)" />
    <path d="M0 -45 L8 -25 L-8 -25 Z" transform="rotate(315)" />
  </g>
  
  <!-- Sun Core -->
  <circle cx="50" cy="50" r="22" fill="url(#sunGlow)" />
</svg>
